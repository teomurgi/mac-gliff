name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: "-p gliff-mtl -p gliff-proto"
          - os: macos-15
            args: "-p gliff-mtl"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy ${{ matrix.args }} --all-targets -- -D warnings
      - name: Test
        if: matrix.os != 'macos-15'
        run: cargo test ${{ matrix.args }}
      # VideoToolbox crashes inside VTDecompressionSessionDecodeFrame on the
      # paravirtualized runner. The C probe runs FFmpeg's exact flow over
      # the same fixture to tell a broken runner VT from an FFI bug; lldb
      # then names the faulting frame of the Rust tests.
      - name: Test (lldb)
        if: matrix.os == 'macos-15'
        run: |
          set -x
          clang -O1 -Wall -o /tmp/vt_probe scripts/vt_probe.c \
            -framework CoreFoundation -framework CoreMedia \
            -framework CoreVideo -framework VideoToolbox
          /tmp/vt_probe crates/gliff-va/src/h264/testdata/x264-64x64.264 || true
          cargo build -p gliff-mtl --tests
          BIN=""
          for f in target/debug/deps/gliff_mtl-*; do
            if [ -f "$f" ] && [ -x "$f" ]; then BIN="$f"; break; fi
          done
          lldb -b -o "process launch -- --test-threads=1 vt" -o "bt all" -- "$BIN" || true
          lldb -b -o "process launch -- --test-threads=1 compute" -o "bt all" -- "$BIN" || true
