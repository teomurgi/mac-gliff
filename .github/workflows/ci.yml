name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: "-p gliff-mtl -p gliff-proto"
          - os: macos-15
            args: "-p gliff-mtl"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy ${{ matrix.args }} --all-targets -- -D warnings
      - name: Test
        if: matrix.os != 'macos-15'
        run: cargo test ${{ matrix.args }}
      # VideoToolbox crashes somewhere inside VTDecompressionSessionDecodeFrame
      # on the paravirtualized runner; run the tests under lldb so the
      # backtrace names the faulting frame.
      - name: Test (lldb)
        if: matrix.os == 'macos-15'
        run: |
          set -x
          cargo build -p gliff-mtl --tests
          BIN=$(find target/debug/deps -maxdepth 1 -name 'gliff_mtl-*' ! -name '*.d' -type f | head -1)
          lldb -b -o "settings set target.run-args --test-threads=1 vt" -o run -o "bt all" -- "$BIN" || true
          lldb -b -o "settings set target.run-args --test-threads=1 compute" -o run -o "bt all" -- "$BIN" || true
