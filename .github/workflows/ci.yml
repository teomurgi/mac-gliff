name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GTK dev libraries
        run: brew install pkg-config gtk4 libadwaita
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: DMG
        run: macos/build-dmg.sh
      - name: Upload DMG
        uses: actions/upload-artifact@v5
        with:
          name: mac-gliff-dmg
          path: dist/*.dmg
